<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperCompras - Gestão de Estoque</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }

        nav {
            margin: 15px 0;
        }

        nav a {
            background-color: #3498db;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 10px;
        }

        nav a:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 5px;
            overflow: hidden;
        }

        table th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
        }

        table td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
        }

        table tr:hover {
            background-color: #f0f0f0;
        }

        .btn-editar {
            background-color: #f39c12;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-remover {
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-editar:hover { background-color: #d68910; }
        .btn-remover:hover { background-color: #c0392b; }

        form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        form input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        form button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        form button:hover {
            background-color: #1e8449;
        }

        .formulario {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }

        .mensagem-vazia {
            text-align: center;
            color: #888;
            padding: 30px;
            background-color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>SuperCompras - Gestão de Estoque</h1>

    <nav>
        <a href="{{ url_for('listar') }}">Ver Produtos</a>
        <a href="{{ url_for('adicionar') }}">Adicionar Produto</a>
    </nav>

    {% block conteudo %}{% endblock %}
</body>
</html>
